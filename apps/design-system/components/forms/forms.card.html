<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);padding:16px;box-sizing:border-box;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style>
</head><body>
<div id="root"></div>
<script>
const { Input, Select, Checkbox } = window.Insell;
const e = React.createElement;
function Demo(){
  const [c, setC] = React.useState(true);
  return e('div', {className:'grid'},
    e(Input, {label:'Nama produk', placeholder:'Kopi susu gula aren'}),
    e(Input, {label:'Harga', prefix:'Rp', error:'Harga wajib diisi'}),
    e(Select, {label:'Outlet', placeholder:'Pilih outlet', options:[{label:'Cabang Kemang',value:'kmg'},{label:'Cabang Senopati',value:'sno'}]}),
    e('div', {style:{display:'flex',flexDirection:'column',gap:10,justifyContent:'center'}},
      e(Checkbox, {label:'Ingat perangkat ini', checked:c, onChange:()=>setC(!c)}),
      e(Checkbox, {label:'Opsi nonaktif', disabled:true})
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>
</body></html>
