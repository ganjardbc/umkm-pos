<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}
body{margin:0}
.canvas{width:1080px;height:1350px;background:var(--color-neutral-25);position:relative;font-family:var(--font-body);display:flex;flex-direction:column;justify-content:space-between;padding:72px}
.top{display:flex;align-items:center;justify-content:space-between}
.top .brand{display:flex;align-items:center;gap:12px}
.top img{height:36px}
.top .brand span{color:var(--color-neutral-800);font-family:var(--font-display);font-weight:800;font-size:22px}
.num{width:52px;height:52px;border-radius:50%;background:var(--brand-solid);color:#fff;font-family:var(--font-display);font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
.mid h2{font-family:var(--font-display);font-weight:800;font-size:58px;line-height:1.1;color:var(--color-neutral-800);letter-spacing:-0.02em;margin:0 0 28px;max-width:880px}
.mid p{font:var(--text-body-lg);font-size:27px;line-height:1.55;color:var(--color-neutral-600);max-width:820px;margin:0}
.card{margin-top:40px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:32px;display:flex;gap:20px;align-items:center;max-width:880px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--color-success);flex-shrink:0}
.card p{font:var(--text-body-md);font-size:22px;color:var(--color-neutral-700);margin:0}
.bottom{display:flex;align-items:center;gap:10px;color:var(--color-neutral-400);font:var(--text-body-sm);font-size:20px}
</style></head><body>
<div class="canvas">
  <div class="top">
    <div class="brand"><img src="../assets/logo/insell-icon.png" alt=""><span>insell.id</span></div>
    <div class="num">01</div>
  </div>
  <div class="mid">
    <h2>Stok tercatat otomatis, bukan diintip dari feeling</h2>
    <p>Setiap transaksi langsung memotong stok. Tidak ada lagi hitung ulang manual di akhir hari.</p>
    <div class="card"><span class="dot"></span><p>Notifikasi otomatis saat stok mendekati batas minimum.</p></div>
  </div>
  <div class="bottom">Geser → &nbsp;·&nbsp; 2/5</div>
</div>
</body></html>
