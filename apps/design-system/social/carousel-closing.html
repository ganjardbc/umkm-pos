<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}
body{margin:0}
.canvas{width:1080px;height:1350px;background:var(--color-primary-600);position:relative;overflow:hidden;font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px}
.canvas::before{content:'';position:absolute;bottom:-220px;left:-160px;width:640px;height:640px;border-radius:50%;background:var(--color-primary-700);opacity:.5}
img.icon{height:88px;margin-bottom:36px;z-index:1}
h2{color:#fff;font-family:var(--font-display);font-weight:800;font-size:60px;line-height:1.1;letter-spacing:-0.02em;margin:0 0 20px;z-index:1;max-width:820px}
p{color:rgba(255,255,255,.85);font:var(--text-body-lg);font-size:26px;margin:0 0 44px;z-index:1;max-width:700px}
.cta{background:#fff;color:var(--color-primary-700);font-family:var(--font-body);font-weight:700;font-size:24px;padding:20px 44px;border-radius:var(--radius-sm);z-index:1}
.handle{margin-top:36px;color:rgba(255,255,255,.7);font:var(--text-body-sm);font-size:20px;z-index:1}
</style></head><body>
<div class="canvas">
  <img class="icon" src="../assets/logo/insell-icon.png" alt="">
  <h2>Coba Insell gratis untuk usahamu</h2>
  <p>Kasir, stok, dan laporan dalam satu dashboard — mulai tanpa kartu kredit.</p>
  <div class="cta">Mulai gratis di insell.id</div>
  <div class="handle">@insell.id</div>
</div>
</body></html>
