<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}
body{margin:0}
.canvas{width:1080px;height:1350px;background:var(--color-primary-600);position:relative;overflow:hidden;font-family:var(--font-body);display:flex;flex-direction:column;justify-content:space-between;padding:72px}
.canvas::before{content:'';position:absolute;top:-180px;right:-180px;width:600px;height:600px;border-radius:50%;background:var(--color-primary-700);opacity:.5}
.top{display:flex;align-items:center;gap:14px;z-index:1}
.top img{height:44px}
.top span{color:#fff;font-family:var(--font-display);font-weight:800;font-size:28px}
.mid{z-index:1}
.eyebrow{display:inline-block;background:rgba(255,255,255,.16);color:#fff;font:var(--text-overline);letter-spacing:var(--tracking-overline);padding:8px 16px;border-radius:999px;margin-bottom:28px}
h1{color:#fff;font-family:var(--font-display);font-weight:800;font-size:76px;line-height:1.05;letter-spacing:-0.02em;margin:0 0 24px;max-width:900px}
p{color:rgba(255,255,255,.85);font:var(--text-body-lg);font-size:26px;max-width:760px;margin:0}
.bottom{z-index:1;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);font:var(--text-body-sm);font-size:20px}
</style></head><body>
<div class="canvas">
  <div class="top"><img src="../assets/logo/insell-icon.png" alt=""><span>insell.id</span></div>
  <div class="mid">
    <span class="eyebrow">UNTUK PEMILIK UMKM</span>
    <h1>3 tanda kasir manual bikin bisnismu rugi diam-diam</h1>
    <p>Kalau stok sering selisih dan laporan harian bikin pusing, ini bukan cuma soal repot.</p>
  </div>
  <div class="bottom">Geser → &nbsp;·&nbsp; 1/5</div>
</div>
</body></html>
