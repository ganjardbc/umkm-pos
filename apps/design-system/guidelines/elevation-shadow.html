<!-- @dsCard group="Elevation" viewport="700x180" subtitle="Navy-tinted, never pure black" name="Shadow scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--color-neutral-50);padding:24px 16px;box-sizing:border-box;display:flex;gap:20px}
.card{width:80px;height:80px;background:var(--surface-page);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}
</style></head><body>
<div class="card" style="box-shadow:var(--shadow-xs)">xs</div>
<div class="card" style="box-shadow:var(--shadow-sm)">sm</div>
<div class="card" style="box-shadow:var(--shadow-md)">md</div>
<div class="card" style="box-shadow:var(--shadow-lg)">lg</div>
<div class="card" style="box-shadow:var(--shadow-xl)">xl</div>
<div class="card" style="box-shadow:var(--shadow-brand)">brand</div>
</body></html>
