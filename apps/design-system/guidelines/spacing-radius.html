<!-- @dsCard group="Spacing" viewport="700x160" subtitle="xs–full, controls vs cards vs badges" name="Radius scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);padding:16px;box-sizing:border-box}
.row{display:flex;gap:14px;align-items:flex-end}
.box{width:64px;height:64px;background:var(--color-primary-100);border:1.5px solid var(--color-primary-400);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.box span{font:var(--text-caption);font-family:var(--font-mono);color:var(--color-primary-700)}
</style></head><body>
<div class="row">
<div class="box" style="border-radius:4px"><span>xs</span></div>
<div class="box" style="border-radius:6px"><span>sm</span></div>
<div class="box" style="border-radius:10px"><span>md</span></div>
<div class="box" style="border-radius:14px"><span>lg</span></div>
<div class="box" style="border-radius:20px"><span>xl</span></div>
<div class="box" style="border-radius:999px"><span>full</span></div>
</div>
</body></html>
