<!-- @dsCard group="Spacing" viewport="700x260" subtitle="4px base unit, 1–32" name="Spacing scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);padding:16px;box-sizing:border-box;font-family:var(--font-mono)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar{height:14px;background:var(--color-primary-400);border-radius:2px}
.lbl{width:130px;font:var(--text-caption);color:var(--text-secondary)}
</style></head><body>
<div class="row"><span class="lbl">--space-1 · 4px</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="lbl">--space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lbl">--space-3 · 12px</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lbl">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lbl">--space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lbl">--space-8 · 32px</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lbl">--space-12 · 48px</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="lbl">--space-16 · 64px</span><div class="bar" style="width:64px"></div></div>
<div class="row"><span class="lbl">--space-24 · 96px</span><div class="bar" style="width:96px"></div></div>
</body></html>
