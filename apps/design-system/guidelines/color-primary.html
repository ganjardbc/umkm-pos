<!-- @dsCard group="Colors" viewport="700x210" subtitle="Brand-anchored orange ramp, 25–900" name="Primary ramp" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--surface-page)}
.row{display:flex}
.sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box}
.sw span{font:var(--text-caption);font-family:var(--font-mono)}
.label{padding:10px 8px 0;display:flex}
.label span{flex:1;font:var(--text-overline);letter-spacing:var(--tracking-overline);text-align:center;color:var(--text-tertiary)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--color-primary-25)"><span style="color:var(--text-primary)">25</span></div>
<div class="sw" style="background:var(--color-primary-50)"><span style="color:var(--text-primary)">50</span></div>
<div class="sw" style="background:var(--color-primary-100)"><span style="color:var(--text-primary)">100</span></div>
<div class="sw" style="background:var(--color-primary-200)"><span style="color:var(--text-primary)">200</span></div>
<div class="sw" style="background:var(--color-primary-300)"><span style="color:#fff">300</span></div>
<div class="sw" style="background:var(--color-primary-400)"><span style="color:#fff">400</span></div>
<div class="sw" style="background:var(--color-primary-500)"><span style="color:#fff">500</span></div>
<div class="sw" style="background:var(--color-primary-600)"><span style="color:#fff">600</span></div>
<div class="sw" style="background:var(--color-primary-700)"><span style="color:#fff">700</span></div>
<div class="sw" style="background:var(--color-primary-800)"><span style="color:#fff">800</span></div>
<div class="sw" style="background:var(--color-primary-900)"><span style="color:#fff">900</span></div>
</div>
<div class="label"><span>25</span><span>50✦</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500✦</span><span>600✦</span><span>700✦</span><span>800</span><span>900</span></div>
<div style="padding:6px 8px;font:var(--text-caption);color:var(--text-tertiary)">✦ = fixed brand anchor</div>
</body></html>
