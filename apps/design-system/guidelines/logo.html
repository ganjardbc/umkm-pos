<!-- @dsCard group="Brand" viewport="700x260" subtitle="Clear space, minimum size, on-ground knockout" name="Logo usage" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);padding:16px;box-sizing:border-box;font-family:var(--font-body);color:var(--text-primary)}
.row{display:flex;gap:20px;align-items:center}
.box{border:1.5px dashed var(--border-strong);padding:22px;display:flex;align-items:center;border-radius:var(--radius-md)}
.box img{height:28px;display:block}
.ico{height:64px}
.onground{background:var(--color-primary-600);border-radius:var(--radius-md);padding:22px;display:flex;align-items:center;justify-content:center}
p{font:var(--text-caption);color:var(--text-tertiary);margin:12px 0 0}
</style></head><body>
<div class="row">
<div class="box"><img src="../assets/logo/insell-logo.png" alt="Insell logo"></div>
<div class="box"><img class="ico" src="../assets/logo/insell-icon.png" alt="Insell icon"></div>
<div class="onground"><img class="ico" style="height:36px;filter:brightness(0) invert(1)" src="../assets/logo/insell-icon.png" alt="Insell icon, white knockout"></div>
</div>
<p>Clear space = badge height on all sides · min width 96px (lockup) / 24px (icon) · on primary fields use white-knockout icon only</p>
</body></html>
