name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.decide.outputs.api }}
      api_changed: ${{ steps.filter.outputs.api }}
      reason_api: ${{ steps.decide.outputs.reason_api }}
      merchant: ${{ steps.decide.outputs.merchant }}
      merchant_changed: ${{ steps.filter.outputs.merchant }}
      reason_merchant: ${{ steps.decide.outputs.reason_merchant }}
      admin: ${{ steps.decide.outputs.admin }}
      admin_changed: ${{ steps.filter.outputs.admin }}
      reason_admin: ${{ steps.decide.outputs.reason_admin }}
      landing: ${{ steps.decide.outputs.landing }}
      landing_changed: ${{ steps.filter.outputs.landing }}
      reason_landing: ${{ steps.decide.outputs.reason_landing }}
      global: ${{ steps.filter.outputs.global }}
      shared: ${{ steps.filter.outputs.shared }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths per app
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            merchant:
              - 'apps/merchant/**'
            admin:
              - 'apps/admin/**'
            landing:
              - 'apps/landing/**'
            shared:
              - 'packages/shared-types/**'
            ui:
              - 'packages/ui/**'
            global:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/**'

      - name: Decide which pipelines run
        id: decide
        run: |
          API=false
          REASON_API="No matching changes"
          MERCHANT=false
          REASON_MERCHANT="No matching changes"
          ADMIN=false
          REASON_ADMIN="No matching changes"
          LANDING=false
          REASON_LANDING="No matching changes"

          if [[ "${{ steps.filter.outputs.global }}" == 'true' ]]; then
            API=true
            REASON_API="Global/root CI files changed"
            MERCHANT=true
            REASON_MERCHANT="Global/root CI files changed"
            ADMIN=true
            REASON_ADMIN="Global/root CI files changed"
            LANDING=true
            REASON_LANDING="Global/root CI files changed"
          else
            if [[ "${{ steps.filter.outputs.api }}" == 'true' ]]; then
              API=true
              REASON_API="apps/api changed"
            fi

            if [[ "${{ steps.filter.outputs.shared }}" == 'true' ]]; then
              API=true
              REASON_API="packages/shared-types changed"
              MERCHANT=true
              REASON_MERCHANT="packages/shared-types changed"
              ADMIN=true
              REASON_ADMIN="packages/shared-types changed"
            fi

            if [[ "${{ steps.filter.outputs.ui }}" == 'true' ]]; then
              MERCHANT=true
              REASON_MERCHANT="packages/ui changed"
              ADMIN=true
              REASON_ADMIN="packages/ui changed"
            fi

            if [[ "${{ steps.filter.outputs.merchant }}" == 'true' ]]; then
              MERCHANT=true
              REASON_MERCHANT="apps/merchant changed"
            fi

            if [[ "${{ steps.filter.outputs.admin }}" == 'true' ]]; then
              ADMIN=true
              REASON_ADMIN="apps/admin changed"
            fi

            if [[ "${{ steps.filter.outputs.landing }}" == 'true' ]]; then
              LANDING=true
              REASON_LANDING="apps/landing changed"
            fi
          fi

          {
            echo "api=$API"
            echo "reason_api=$REASON_API"
            echo "merchant=$MERCHANT"
            echo "reason_merchant=$REASON_MERCHANT"
            echo "admin=$ADMIN"
            echo "reason_admin=$REASON_ADMIN"
            echo "landing=$LANDING"
            echo "reason_landing=$REASON_LANDING"
          } >> "$GITHUB_OUTPUT"

  build-api:
    name: API — Lint, Test & Build
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.api == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types package
        run: pnpm --filter @umkm-pos/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter umkm-pos-api exec prisma generate

      - name: Run lint
        run: pnpm --filter umkm-pos-api lint:ci

      - name: Run unit tests
        run: pnpm --filter umkm-pos-api test

      - name: Build API
        run: pnpm --filter umkm-pos-api build

  build-merchant:
    name: Merchant — Build
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.merchant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types package
        run: pnpm --filter @umkm-pos/shared-types build

      # NOTE: apps/merchant has no lint/test script today — build (vue-tsc -b && vite build)
      # is the only gate available and it does include typechecking.
      - name: Build merchant app
        run: pnpm --filter @umkm-pos/merchant build

  build-admin:
    name: Admin — Build
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.admin == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types package
        run: pnpm --filter @umkm-pos/shared-types build

      # NOTE: apps/admin has no lint/test script today — build (vue-tsc -b && vite build)
      # is the only gate available and it does include typechecking.
      - name: Build admin app
        run: pnpm --filter @umkm-pos/admin build

  build-landing:
    name: Landing — Build
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.landing == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: apps/landing has no lint/test script today — build (vue-tsc -b && vite build)
      # is the only gate available and it does include typechecking.
      - name: Build landing app
        run: pnpm --filter @umkm-pos/landing build

  deploy-api:
    name: Deploy API to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build-api]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.prepare.outputs.api == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== SSH Session Started ==="
            cd ${{ secrets.DEPLOY_PATH || '$HOME/devbox/workspace/umkm-pos' }}

            echo "[INFO] Fetching latest changes from Git..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            echo "[INFO] Executing deployment script..."
            ./apps/api/deploy.sh --mode docker --skip-tests

            echo "=== SSH Session Completed ==="

  deploy-merchant:
    name: Deploy Merchant to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build-merchant]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.prepare.outputs.merchant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== SSH Session Started ==="
            cd ${{ secrets.DEPLOY_PATH || '$HOME/devbox/workspace/umkm-pos' }}

            echo "[INFO] Fetching latest changes from Git..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            echo "[INFO] Rebuilding and recreating umkm-pos-merchant container..."
            docker compose build --no-cache umkm-pos-merchant
            docker compose up -d --force-recreate --no-deps umkm-pos-merchant

            # Service was renamed from umkm-pos-web; remove the orphaned container if still present.
            docker rm -f umkm-pos-web 2>/dev/null || true

            echo "=== SSH Session Completed ==="

  deploy-admin:
    name: Deploy Admin to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build-admin]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.prepare.outputs.admin == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== SSH Session Started ==="
            cd ${{ secrets.DEPLOY_PATH || '$HOME/devbox/workspace/umkm-pos' }}

            echo "[INFO] Fetching latest changes from Git..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            echo "[INFO] Rebuilding and recreating umkm-pos-admin container..."
            docker compose build --no-cache umkm-pos-admin
            docker compose up -d --force-recreate --no-deps umkm-pos-admin

            echo "=== SSH Session Completed ==="

  deploy-landing:
    name: Deploy Landing to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build-landing]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.prepare.outputs.landing == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== SSH Session Started ==="
            cd ${{ secrets.DEPLOY_PATH || '$HOME/devbox/workspace/umkm-pos' }}

            echo "[INFO] Fetching latest changes from Git..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            echo "[INFO] Rebuilding and recreating umkm-pos-landing container..."
            docker compose build --no-cache umkm-pos-landing
            docker compose up -d --force-recreate --no-deps umkm-pos-landing

            echo "=== SSH Session Completed ==="

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [prepare, build-api, build-merchant, build-admin, build-landing, deploy-api, deploy-merchant, deploy-admin, deploy-landing]
    if: always()
    steps:
      - name: Publish summary
        run: |
          {
            echo "## CI Selective Execution Summary"
            echo ""
            echo "| Area | Changed | Executed | Reason |"
            echo "|------|---------|----------|--------|"
            echo "| api | ${{ needs.prepare.outputs.api_changed }} | ${{ needs.prepare.outputs.api }} | ${{ needs.prepare.outputs.reason_api }} |"
            echo "| merchant | ${{ needs.prepare.outputs.merchant_changed }} | ${{ needs.prepare.outputs.merchant }} | ${{ needs.prepare.outputs.reason_merchant }} |"
            echo "| admin | ${{ needs.prepare.outputs.admin_changed }} | ${{ needs.prepare.outputs.admin }} | ${{ needs.prepare.outputs.reason_admin }} |"
            echo "| landing | ${{ needs.prepare.outputs.landing_changed }} | ${{ needs.prepare.outputs.landing }} | ${{ needs.prepare.outputs.reason_landing }} |"
            echo "| shared-types | ${{ needs.prepare.outputs.shared }} | n/a (impact rule) | Triggers api + merchant + admin |"
            echo "| ui | ${{ needs.prepare.outputs.ui }} | n/a (impact rule) | Triggers merchant + admin |"
            echo "| global/root | ${{ needs.prepare.outputs.global }} | full CI | Triggers api + merchant + admin + landing |"
            echo ""
            echo "### Job results"
            echo "- api job: ${{ needs.build-api.result }}"
            echo "- merchant job: ${{ needs.build-merchant.result }}"
            echo "- admin job: ${{ needs.build-admin.result }}"
            echo "- landing job: ${{ needs.build-landing.result }}"
            echo "- deploy-api job: ${{ needs.deploy-api.result }}"
            echo "- deploy-merchant job: ${{ needs.deploy-merchant.result }}"
            echo "- deploy-admin job: ${{ needs.deploy-admin.result }}"
            echo "- deploy-landing job: ${{ needs.deploy-landing.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
